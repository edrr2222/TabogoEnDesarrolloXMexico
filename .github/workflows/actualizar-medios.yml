# Cada vez que alguien sube, cambia o borra algo en medios/,
# esta acción vuelve a generar medios.json y lo guarda en el repositorio.
name: Actualizar lista de medios

on:
  push:
    paths:
      - "medios/**"
      - "generar_medios.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  medios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar medios.json
        run: python3 generar_medios.py
      - name: Guardar cambios
        run: |
          if git diff --quiet -- medios.json; then
            echo "medios.json ya estaba al día"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
            git add medios.json
            git commit -m "Actualizar medios.json"
            git push
          fi
